<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LoL Draft Helper</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/script.js" defer></script>
</head>
<body>
  <header>
    <h1>LoL Draft Helper</h1>
  </header>

  <!-- Mod Seçim Ekranı -->
  <section id="mode-stage">
    <h2>Select Drafting Mode</h2>
    <div class="mode-options">
      <button class="mode-button" onclick="chooseMode('classic')">Classic</button>
      <button class="mode-button" onclick="chooseMode('fearless')">Fearless</button>
    </div>
  </section>

  <!-- Fearless modda seçilen şampiyonları gösterecek alan -->
  <div id="fearless-picked-champions" class="fearless-picked-champions" style="display:none; position: fixed; top: 10px; right: 10px; background: rgba(255,255,255,0.9); padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
    <h4>Fearless Picked Champions:</h4>
    <div id="fearless-picked-champions-list"></div>
  </div>

  <main>
    <!-- Draft aşaması (bans) -->
    <section id="draft-stage" style="display:none;">
      <h2>Bans</h2>
      <div class="autocomplete">
        <label for="blue-ban1">Blue 1. Ban:</label>
        <input type="text" id="blue-ban1" class="autocomplete-input" autocomplete="off">
      </div>
      <div class="autocomplete">
        <label for="blue-ban2">Blue 2. Ban:</label>
        <input type="text" id="blue-ban2" class="autocomplete-input" autocomplete="off">
      </div>
      <div class="autocomplete">
        <label for="blue-ban3">Blue 3. Ban:</label>
        <input type="text" id="blue-ban3" class="autocomplete-input" autocomplete="off">
      </div>
      <div class="autocomplete">
        <label for="red-ban1">Red 1. Ban:</label>
        <input type="text" id="red-ban1" class="autocomplete-input" autocomplete="off">
      </div>
      <div class="autocomplete">
        <label for="red-ban2">Red 2. Ban:</label>
        <input type="text" id="red-ban2" class="autocomplete-input" autocomplete="off">
      </div>
      <div class="autocomplete">
        <label for="red-ban3">Red 3. Ban:</label>
        <input type="text" id="red-ban3" class="autocomplete-input" autocomplete="off">
      </div>
      <button onclick="startDraft()">Start Draft</button>
    </section>

    <!-- Seçim aşaması -->
    <section id="selection-stage" style="display:none;">
      <h2>Selections</h2>
      <div id="selection-prompts"></div>
      <div id="selection-status" class="flex-container"></div>
      <button id="next-selection-button">Next Selection</button>
    </section>

    <!-- Özet aşaması -->
    <section id="summary-stage" style="display:none;">
      <h2>Summary</h2>
      <div id="selected-champions"></div>
      <!-- Fearless modda burası "Next Match" olarak çalışacak -->
      <button onclick="resetDraft()">Next Match</button>
    </section>
  </main>

  <footer>
    <p>mail: fatihgazi.goc.contact@gmail.com ---- dc: fatih8709</p>
    <p>&copy; 2025 LoL Draft Helper ---- This project is not supported by Riot Games</p>
  </footer>
</body>
</html>
